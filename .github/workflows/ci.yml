name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent-runner:
    name: agent-runner (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/agent-runner/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        env:
          ANTHROPIC_API_KEY: dummy
        run: |
          python -c "from agent_runner.runner import run_server; print('OK')"
          python -c "from agent_runner.agent_core import AgentCore; print('OK')"

      - name: Docker build
        run: docker build -t toolify/agent-runner:ci .

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t toolify/web:ci .

  watermark-remover:
    name: watermark-remover (Python sidecar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/watermark-remover
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FastAPI app imports
        run: |
          python -c "from app import app; print('OK')"

      - name: Docker build
        # Đặt WATERMARKS_REF qua build arg; tag của upstream repo.
        run: docker build --build-arg WATERMARKS_REF=v0.7.0 -t toolify/watermark-remover:ci .
